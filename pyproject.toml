[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports, redefinitions and comparison
# mistakes. Selected explicitly so the check stays stable across ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# app.py loads .env before importing core.ai, which reads its settings at import time.
# Scripts put the repository root on sys.path before importing core.
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]
